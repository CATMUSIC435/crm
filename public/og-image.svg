  <text x="100" y="580" fill="#64748B" font-family="system-ui, sans-serif" font-size="16" font-weight="500">© 2026 NOVA CRM. Nền Tảng PropTech Đẳng Cấp Doanh Nghiệp.</text>
  <text x="1010" y="580" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="16" font-weight="700">novacrm.vn</text>
