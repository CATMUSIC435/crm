apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novacrm-ingress
  namespace: novacrm-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "novacrm-backend-service"
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  tls:
    - hosts:
        - app.novacrm.com
        - api.novacrm.com
      secretName: novacrm-tls-cert
  rules:
    # 1. API & WebSocket Gateway Domain
    - host: api.novacrm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novacrm-backend-service
                port:
                  number: 4000
    # 2. Frontend Web Dashboard Domain
    - host: app.novacrm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novacrm-frontend-service
                port:
                  number: 3000
