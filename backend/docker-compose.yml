services:
  # PostgreSQL 16 with PostGIS & pgvector
  postgres:
    image: postgis/postgis:16-3.4
    container_name: novacrm-postgres
    restart: always
    environment:
      POSTGRES_USER: novacrm
      POSTGRES_PASSWORD: novacrm_password
      POSTGRES_DB: novacrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novacrm -d novacrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 for Distributed Locks, Caching & BullMQ
  redis:
    image: redis:7-alpine
    container_name: novacrm-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3 Object Storage for Contracts, PDFs & 360 Media
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: novacrm-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
