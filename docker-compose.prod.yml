version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. CSDL POSTGRESQL 16 (POSTGIS + PGVECTOR)
  # -------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: novacrm-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novacrm_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novacrm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacrm_network

  # -------------------------------------------------------------
  # 2. IN-MEMORY CACHE & REDLOCK (REDIS 7)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: novacrm-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - novacrm_network

  # -------------------------------------------------------------
  # 3. OBJECT STORAGE S3 COMPATIBLE (MINIO)
  # -------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: novacrm-prod-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_prod_data:/data
    networks:
      - novacrm_network

  # -------------------------------------------------------------
  # 4. BACKEND NESTJS 10 CLUSTER
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novacrm-prod-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novacrm_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-nova_crm_production_super_secret_jwt_key_2026}
      JWT_EXPIRES_IN: 86400s
      CORS_ORIGIN: '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novacrm_network

  # -------------------------------------------------------------
  # 5. FRONTEND NEXT.JS 16 WEB DASHBOARD
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacrm-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
    depends_on:
      - backend
    networks:
      - novacrm_network

  # -------------------------------------------------------------
  # 6. NGINX REVERSE PROXY & SSL TERMINATION
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: novacrm-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - novacrm_network

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  novacrm_network:
    driver: bridge
